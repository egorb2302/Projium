name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Git identity for test repos
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: Windows background start timing
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 6
        run: node --no-warnings test/windows-start-probe.mjs
      - name: Tests
        run: node --no-warnings --import ./test/hermetic.mjs --test --test-timeout=30000 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=test-results.tap "test/*.test.mjs"
      - name: Failed tests as annotations
        if: failure()
        shell: bash
        run: node test/annotate.mjs test-results.tap
